name: AlmaLinux new user test

on:
  workflow_dispatch:
    inputs:
      include_almalinux_10:
        description: Also test AlmaLinux 10
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * *'
      timezone: Asia/Kolkata
  pull_request:
    paths:
      - Makefile
      - README.md
      - docs/build-guidelines.md
      - docs/almalinux-user-test.md
      - .github/workflows/almalinux-user-test.yml
      - .github/scripts/almalinux-*.sh
      - .github/scripts/compiler-cache.sh
      - .github/scripts/install-compiler-cache.py
      - common/**
      - sampler/**
      - collector/**
      - metrics/**
      - socket_sampler/**
      - scripts/**
      - tests/**
      - config/**

permissions:
  contents: read

concurrency:
  group: almalinux-${{ github.head_ref || github.ref_name }}-${{ github.event_name == 'pull_request' && 'normal' || 'static' }}
  cancel-in-progress: true

jobs:
  format:
    name: C++ format
    # Fork pull requests run on GitHub; everything else on the owner's runner.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'self-hosted' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: make format-check CLANG_FORMAT='pipx run --spec clang-format==22.1.8 clang-format'
  test:
    name: AlmaLinux ${{ matrix.version }}
    # Fork pull requests run on GitHub; everything else on the owner's runner.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'self-hosted' }}
    timeout-minutes: 30
    needs: format
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(github.event_name == 'pull_request' && '["8"]' || github.event_name == 'workflow_dispatch' && inputs.include_almalinux_10 && '["8", "9", "10"]' || '["8", "9"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set compiler cache directory
        run: echo "CCACHE_HOST_DIR=$RUNNER_TEMP/triangulator-cache/alma${{ matrix.version }}" >> "$GITHUB_ENV"
      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_HOST_DIR }}
          key: compiler-v1-${{ runner.os }}-${{ runner.arch }}-alma${{ matrix.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compiler-v1-${{ runner.os }}-${{ runner.arch }}-alma${{ matrix.version }}-
      - name: Build and test in AlmaLinux
        env:
          ALMA_VERSION: ${{ matrix.version }}
          RUN_STATIC_TESTS: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: |
          mkdir -p reports "$CCACHE_HOST_DIR"
          docker pull "almalinux:$ALMA_VERSION"
          docker image inspect "almalinux:$ALMA_VERSION" > reports/image.json
          docker run --rm \
            -e ALMA_VERSION -e RUN_STATIC_TESTS \
            -v "$PWD:/source:ro" \
            -v "$PWD/reports:/reports" -v "$CCACHE_HOST_DIR:/cache" \
            "almalinux:$ALMA_VERSION" \
            bash /source/.github/scripts/almalinux-build.sh
      - name: Run copied release binaries in a clean container
        if: github.event_name != 'pull_request'
        env:
          ALMA_VERSION: ${{ matrix.version }}
        run: |
          docker run --rm --user 1000:1000 \
            --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/reports:/reports" \
            -v "$PWD/.github/scripts/almalinux-runtime.sh:/test.sh:ro" \
            "almalinux:$ALMA_VERSION" bash /test.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          response = Path('reports/runtime-live.http').read_bytes()
          headers, body = response.split(b'\r\n\r\n', 1)
          assert headers.split(b'\r\n', 1)[0].split()[1] == b'200', headers
          live = json.loads(body)
          assert live['threads'], live
          assert live['threads'][0]['name'] == 'sleep', live['threads']
          assert live['health']['pid'] == int(Path('reports/runtime-target.pid').read_text()), live['health']
          print('Copied static binaries monitored the target as UID 1000.')
          PY
      - name: Save test logs and binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: almalinux-${{ matrix.version }}-new-user-test
          path: reports/
          retention-days: 14
      # Restore ownership before actions/cache saves files from the container.
      - name: Return report and cache files to the runner user
        if: always()
        env:
          ALMA_VERSION: ${{ matrix.version }}
        run: |
          owner="$(id -u):$(id -g)"
          [[ "$RUNNER_ENVIRONMENT" != self-hosted ]] || owner=0:0
          mkdir -p "$CCACHE_HOST_DIR" reports
          docker run --rm -v "$PWD/reports:/reports" -v "$CCACHE_HOST_DIR:/cache" \
            "almalinux:$ALMA_VERSION" chown -R "$owner" /reports /cache
