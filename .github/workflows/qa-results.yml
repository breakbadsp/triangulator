name: QA results

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - README.md
      - docs/qa/**
      - scripts/qa_summary.py
  pull_request:
    paths:
      - README.md
      - docs/qa/**
      - scripts/qa_summary.py
      - .github/workflows/qa-results.yml

permissions:
  contents: read

jobs:
  summary:
    name: Check and publish QA results
    # Fork pull requests run on GitHub; everything else on the owner's runner.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || fromJSON('["self-hosted", "Linux", "X64", "triangulator"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: python3 scripts/qa_summary.py --check --github-summary
