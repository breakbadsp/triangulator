name: Release package

# A tag like v0.1.0 builds the packages and publishes them as a GitHub release.
# Pull requests that touch the packaging only build and test them.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - Makefile
      - scripts/**
      - config/**
      - deploy/**
      - .github/workflows/release-package.yml
      - .github/scripts/almalinux-package*.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-package-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Package for AlmaLinux 8 and 9
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and test packages
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Releases are named after the tag; other runs after the commit.
          version="${REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || version="dev-${GITHUB_SHA::7}"
          mkdir -p dist
          for el in 8 9; do
            docker run --rm -e ALMA_VERSION="$el" \
              -v "$PWD:/source:ro" -v "$PWD/dist:/dist" \
              "almalinux:$el" bash /source/.github/scripts/almalinux-package.sh "$version"
            # A clean image with no compiler and no repository: only one package.
            for kind in sampler collector; do
              docker run --rm --user 1000:1000 -e HOME=/tmp/home \
                --cap-drop ALL --security-opt no-new-privileges \
                -v "$PWD/dist:/dist:ro" \
                -v "$PWD/.github/scripts/almalinux-package-smoke.sh:/smoke.sh:ro" \
                "almalinux:$el" bash -c 'mkdir -p "$HOME" && bash /smoke.sh "$0" /dist/triangulator-"$0"-*-el'"$el"'-*.tar.gz' "$kind"
            done
          done
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: dist/
          retention-days: 14
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
