name: Release package

# A tag like v0.1.0 builds the packages and publishes them as a GitHub release.
# Nightly and manual runs build and test the packages without publishing them.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-package-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Package for AlmaLinux ${{ matrix.version }}
    # Fork pull requests run on GitHub; everything else on the owner's runner.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || fromJSON('["self-hosted", "Linux", "X64", "triangulator"]') }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        version: [8, 9]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set compiler cache directory
        run: |
          cache_root="$RUNNER_TEMP/triangulator-cache"
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            cache_root="$HOME/.cache/triangulator"
          fi
          echo "CCACHE_HOST_DIR=$cache_root/alma${{ matrix.version }}-package" >> "$GITHUB_ENV"
      - name: Restore compiler cache
        if: runner.environment != 'self-hosted'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_HOST_DIR }}
          key: compiler-v1-${{ runner.os }}-${{ runner.arch }}-alma${{ matrix.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compiler-v1-${{ runner.os }}-${{ runner.arch }}-alma${{ matrix.version }}-
      - name: Build and test packages
        env:
          REF_NAME: ${{ github.ref_name }}
          ALMA_VERSION: ${{ matrix.version }}
        run: |
          # Releases are named after the tag; other runs after the commit.
          version="${REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || version="dev-${GITHUB_SHA::7}"
          mkdir -p dist "$CCACHE_HOST_DIR"
          docker run --rm -e ALMA_VERSION \
            -v "$PWD:/source:ro" -v "$PWD/dist:/dist" -v "$CCACHE_HOST_DIR:/cache" \
            "almalinux:$ALMA_VERSION" bash /source/.github/scripts/almalinux-package.sh "$version"
          # A clean image with no compiler and no repository: only one package.
          for kind in sampler collector; do
            docker run --rm --user 1000:1000 -e HOME=/tmp/home -e ALMA_VERSION \
              --cap-drop ALL --security-opt no-new-privileges \
              -v "$PWD/dist:/dist:ro" \
              -v "$PWD/.github/scripts/almalinux-package-smoke.sh:/smoke.sh:ro" \
              "almalinux:$ALMA_VERSION" bash -c 'mkdir -p "$HOME" && bash /smoke.sh "$0" /dist/triangulator-"$0"-*-el"$ALMA_VERSION"-*.tar.gz' "$kind"
          done
          ls -l dist
      - name: Return compiler cache to the runner user
        if: always() && runner.environment != 'self-hosted'
        env:
          ALMA_VERSION: ${{ matrix.version }}
        run: |
          owner="$(id -u):$(id -g)"
          mkdir -p "$CCACHE_HOST_DIR"
          docker run --rm -v "$CCACHE_HOST_DIR:/cache" \
            "almalinux:$ALMA_VERSION" chown -R "$owner" /cache
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-el${{ matrix.version }}
          path: dist/
          retention-days: 14

  scout:
    name: Build optional tri-scout asset
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: make scout
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tri-scout
          path: build/tri-scout.mjs
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, scout]
    runs-on: [self-hosted, Linux, X64, triangulator]
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-el*
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tri-scout
          path: dist/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
