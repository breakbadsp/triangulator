name: Sanitizer tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
      timezone: Asia/Kolkata

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.sanitizer }}
    # Fork pull requests run on GitHub; everything else on the owner's runner.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'self-hosted' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The self-hosted runner already has these installed.
      - name: Install build and test dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 libsqlite3-dev nodejs
      # The self-hosted kernel already defaults to 28 bits.
      - name: Set the address layout for ThreadSanitizer
        if: matrix.sanitizer == 'thread' && runner.environment == 'github-hosted'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Run the full test suite
        env:
          CXX: ${{ runner.environment == 'github-hosted' && 'g++-14' || 'g++' }}
        run: |
          set -o pipefail
          make -j2 check SANITIZER=${{ matrix.sanitizer }} 2>&1 | tee sanitizer-check.log
      - name: Save test logs and sanitizer reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sanitizer-${{ matrix.sanitizer }}
          path: |
            sanitizer-check.log
            build/sanitizer-reports/
          retention-days: 14
