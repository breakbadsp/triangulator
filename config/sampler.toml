# Processes to monitor, by exact Linux name. /proc/PID/comm keeps only 15
# bytes, not the command line. Each matching process is its own target; its
# ID is the name, then name.2, name.3 for more instances at the same time.
# The sampler needs at least one entry here or in process_patterns.
process_names = ["ghostty"]
rate_hz = 5.0
collector = "127.0.0.1:9400"
status_fallback = false
# Seconds between resource samples: pressure, descriptors, socket queues and
# network drops (default 2; 0 = off; 1..60). Never more often than thread
# ticks. A sample costs about 5 ms for a target with 500 descriptors; see
# docs/target-impact.md.
resource_interval_s = 2
# Seconds between memory-map samples: /proc/PID/maps and the address-space
# summary (default 30; 0 = off; 1..3600). Reading maps briefly shares the
# target's memory-map lock; see docs/measurement-limits.md.
memory_interval_s = 30

# CPU budget as a percentage of one CPU core. The sampler can lower its rate.
cpu_budget_pct = 10.0

# Optional exact names from process_names. When the budget throttles, these
# targets keep rate_hz and the other targets slow down.
# critical_names = ["orders-api"]
# Extra CPU, in percent of one core, that the sampler may use above
# cpu_budget_pct while a critical target runs (0..50).
# critical_extra_budget_pct = 5.0

# Optional whole-name globs: * matches any bytes; ? matches one byte.
# Matching ignores ASCII case: "T3*" matches "t3code". Exact names do not.
# process_patterns = ["worker-*"]
# Preallocated instance slots, 1..16 (default 8). Keep at least one slot per
# configured exact name. Each matching PID/start time gets its own session.
# max_targets = 8
