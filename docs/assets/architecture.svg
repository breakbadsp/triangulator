<text class="s" x="1090" y="450" text-anchor="middle">Dashboard</text>
<rect x="1030" y="160" width="120" height="90" rx="12" fill="none" stroke="#6b7aa5" stroke-dasharray="6 5" stroke-width="1.6"/>
<text class="h" x="1090" y="192" text-anchor="middle" style="fill:#9db0d6">Alerting</text>
<text class="s" x="1090" y="212" text-anchor="middle">separate module</text>
<text class="s" x="1090" y="230" text-anchor="middle">not wired up yet</text>
<text class="m" x="752" y="262" text-anchor="end">rollups</text>
<text class="m" x="888" y="296">history</text>
<text class="m" x="890" y="388" style="display:none"></text>
<text class="m" x="1000" y="188" text-anchor="middle" style="fill:#7f8db5">reads</text>
<text class="s" x="30" y="528">Blue dots: raw samples. Amber: stored rollups. Violet: views for the browser.</text>
<text class="s" x="1170" y="528" text-anchor="end">Ports are defaults.</text>
