<rect x="164" y="236" width="13" height="10" rx="3" fill="#f26a2e" fill-opacity="0.85"><animate attributeName="y" values="236;228;236;190;236" dur="4.0s" repeatCount="indefinite"/><animate attributeName="height" values="10;18;10;56;10" dur="4.0s" repeatCount="indefinite"/></rect>
