<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">Triangulator architecture</title>
<desc id="d">The sampler reads /proc for the target process and sends samples over UDP to the collector. The collector writes SQLite day files and serves the dashboard over HTTP. A separate alerting module, not wired up yet, reads the SQLite files.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#121c3b"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#7f9bff" fill-opacity="0.12"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 9 5 0 9z" fill="#8aa4ff" fill-opacity="0.8"/></marker>
<marker id="ahd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 9 5 0 9z" fill="#6b7aa5"/></marker>
<clipPath id="round"><rect width="1200" height="560" rx="20"/></clipPath>
</defs>
<style>
text { font-family: Inter, "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; fill: #dbe4ff; }
.h { font-size: 18px; font-weight: 700; }
.s { font-size: 13px; fill: #9db0d6; }
.m { font-size: 12px; fill: #9db0d6; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.zone { font-size: 12px; font-weight: 700; letter-spacing: 2.4px; fill: #7f93c4; }
.box { fill: #101a38; stroke-width: 1.6; }
</style>
<g clip-path="url(#round)"><rect width="1200" height="560" fill="url(#bg)"/><rect width="1200" height="560" fill="url(#dots)"/>
<rect x="30" y="70" width="350" height="420" rx="16" fill="none" stroke="#6b7aa5" stroke-opacity="0.5" stroke-dasharray="6 6"/>
<text class="zone" x="50" y="98">TARGET HOST · LINUX</text>
<rect x="430" y="70" width="740" height="420" rx="16" fill="none" stroke="#6b7aa5" stroke-opacity="0.5" stroke-dasharray="6 6"/>
<text class="zone" x="450" y="98">COLLECTOR HOST</text>
<text class="h" x="30" y="40" style="font-size:22px">How a thread sample travels</text>
<text class="s" x="30" y="58">One-way UDP. No agent in the target. No sudo.</text>
<rect class="box" x="60" y="120" width="290" height="140" rx="12" stroke="#60a5fa" stroke-opacity="0.7"/>
<text class="h" x="78" y="148">Target process</text>
<text class="s" x="78" y="166">Many threads, any language</text>
<rect x="80" y="216" width="13" height="30" rx="3" fill="#f26a2e" fill-opacity="0.85"><animate attributeName="y" values="216;228;202;236;216" dur="2.2s" repeatCount="indefinite"/><animate attributeName="height" values="30;18;44;10;30" dur="2.2s" repeatCount="indefinite"/></rect>
<rect x="101" y="236" width="13" height="10" rx="3" fill="#60a5fa" fill-opacity="0.85"><animate attributeName="y" values="236;190;236;216;236" dur="2.6500000000000004s" repeatCount="indefinite"/><animate attributeName="height" values="10;56;10;30;10" dur="2.6500000000000004s" repeatCount="indefinite"/></rect>
