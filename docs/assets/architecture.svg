<rect x="311" y="236" width="13" height="10" rx="3" fill="#60a5fa" fill-opacity="0.85"><animate attributeName="y" values="236;190;190;228;236" dur="2.6500000000000004s" repeatCount="indefinite"/><animate attributeName="height" values="10;56;56;18;10" dur="2.6500000000000004s" repeatCount="indefinite"/></rect>
<rect class="box" x="60" y="340" width="290" height="110" rx="12" stroke="#34d399" stroke-opacity="0.8"/>
<text class="h" x="78" y="370">Sampler</text>
<text class="s" x="78" y="390">C++ · static binary · zero dependencies</text>
<text class="m" x="78" y="414">stat  schedstat  io  wchan</text>
<text class="m" x="78" y="434">1 Hz default · 0.2–10 Hz</text>
<path id="p0" d="M205 262V338" stroke="#8aa4ff" stroke-opacity="0.8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<text class="m" x="216" y="305">read-only /proc</text>
<path id="pu" d="M350 395H500" fill="none" stroke="#8aa4ff" stroke-opacity="0.8" stroke-width="1.6" marker-end="url(#ah)"/>
<path id="pc_db" d="M730 360C770 360 770 205 810 205" fill="none" stroke="#8aa4ff" stroke-opacity="0.8" stroke-width="1.6" marker-end="url(#ah)"/>
<path id="pc_http" d="M730 395H810" fill="none" stroke="#8aa4ff" stroke-opacity="0.8" stroke-width="1.6" marker-end="url(#ah)"/>
<path id="pdb_http" d="M880 250V328" fill="none" stroke="#8aa4ff" stroke-opacity="0.8" stroke-width="1.6" marker-end="url(#ah)"/>
<path id="phb" d="M970 395H1030" fill="none" stroke="#8aa4ff" stroke-opacity="0.8" stroke-width="1.6" marker-end="url(#ah)"/>
<path id="pdb_al" d="M950 205H1030" fill="none" stroke="#6b7aa5" stroke-opacity="0.8" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ahd)"/>
<text class="h" x="425" y="360" text-anchor="middle" style="font-size:15px">UDP :9400</text>
<text class="m" x="425" y="378" text-anchor="middle">112-byte records</text>
<text class="m" x="425" y="416" text-anchor="middle">10 per datagram</text>
<rect class="box" x="500" y="330" width="230" height="130" rx="12" stroke="#34d399" stroke-opacity="0.8"/>
<text class="h" x="518" y="360">Collector</text>
<text class="s" x="518" y="380">C++ · single binary</text>
<text class="m" x="518" y="404">reorder · dedupe</text>
<text class="m" x="518" y="422">per-thread rollups</text>
<text class="m" x="518" y="440">loss + health</text>
<path d="M810.0 164V236A70.0 14 0 0 0 950.0 236V164" fill="#101a38" stroke="#fbbf24" stroke-opacity="0.8" stroke-width="1.6"/>
<ellipse cx="880" cy="164" rx="70.0" ry="14" fill="#16224a" stroke="#fbbf24" stroke-opacity="0.8" stroke-width="1.6"/>
<text class="h" x="880" y="208" text-anchor="middle">SQLite</text>
<text class="s" x="880" y="227" text-anchor="middle">one file per UTC day</text>
<rect class="box" x="810" y="330" width="160" height="130" rx="12" stroke="#a78bfa" stroke-opacity="0.8"/>
<text class="h" x="828" y="360">HTTP server</text>
<text class="s" x="828" y="380">:9401 · loopback</text>
<text class="m" x="828" y="404">/api/live</text>
<text class="m" x="828" y="422">/api/history</text>
<text class="m" x="828" y="440">/api/replay</text>
<rect class="box" x="1030" y="330" width="120" height="130" rx="12" stroke="#a78bfa" stroke-opacity="0.8"/>
<path d="M1030 358H1150" stroke="#8aa4ff" stroke-opacity="0.35"/><circle cx="1044" cy="344" r="3" fill="#f26a2e"/><circle cx="1055" cy="344" r="3" fill="#fbbf24"/><circle cx="1066" cy="344" r="3" fill="#34d399"/>
