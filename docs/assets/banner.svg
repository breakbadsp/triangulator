<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">Triangulator</title>
  <desc id="d">Three observation points send out rings. The rings meet at one point, the target thread, which pulses.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1c"/>
      <stop offset="1" stop-color="#16224a"/>
    </linearGradient>
    <linearGradient id="edge" x1="14" y1="93" x2="64" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c8f5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f26a2e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f26a2e" stop-opacity="0"/>
    </radialGradient>
    <!-- a lattice of equilateral triangles -->
    <pattern id="lattice" width="60" height="103.92" patternUnits="userSpaceOnUse">
      <path d="M0 0H60M0 103.92 30 0 60 103.92M0 0 30 103.92 60 0" fill="none" stroke="#7f9bff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="400" rx="20"/></clipPath>
  </defs>
  <style>
    text { font-family: Inter, "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
  </style>
  <g clip-path="url(#round)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#lattice)"/>

    <!-- scene: triangle side 300 px, centered at (975,205) -->
    <g transform="translate(975 205) scale(2.6) translate(-64 -64)">
      <circle cx="64" cy="64" r="57.7" fill="none" stroke="#8aa4ff" stroke-opacity="0.35" stroke-width="0.6" stroke-dasharray="1 3">
        <animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="60s" repeatCount="indefinite"/>
      </circle>

      <!-- three expanding rings; they meet at the target when r = 57.7 -->
      <g fill="none" stroke="#60a5fa" stroke-width="0.9">
        <circle cx="64" cy="6.3" r="0" opacity="0">
          <animate attributeName="r" values="0;57.7;66" keyTimes="0;0.625;1" dur="3.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.9;0.55;0" keyTimes="0;0.05;0.625;1" dur="3.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="114" cy="92.9" r="0" opacity="0">
          <animate attributeName="r" values="0;57.7;66" keyTimes="0;0.625;1" dur="3.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.9;0.55;0" keyTimes="0;0.05;0.625;1" dur="3.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="14" cy="92.9" r="0" opacity="0">
          <animate attributeName="r" values="0;57.7;66" keyTimes="0;0.625;1" dur="3.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.9;0.55;0" keyTimes="0;0.05;0.625;1" dur="3.6s" repeatCount="indefinite"/>
        </circle>
      </g>

      <path d="M64 6.3V64M14 92.9 64 64M114 92.9 64 64" stroke="#8aa4ff" stroke-opacity="0.5" stroke-width="0.7"/>
      <circle cx="64" cy="64" r="28.9" fill="none" stroke="#8aa4ff" stroke-opacity="0.55" stroke-width="0.8"/>
      <path d="M64 6.3 114 92.9H14Z" fill="none" stroke="url(#edge)" stroke-width="2.4" stroke-linejoin="round"/>
      <g fill="#0b1220" stroke="url(#edge)" stroke-width="1.6">
        <circle cx="64" cy="6.3" r="3.4"/><circle cx="114" cy="92.9" r="3.4"/><circle cx="14" cy="92.9" r="3.4"/>
      </g>

      <!-- the target: flashes when the rings meet -->
      <circle cx="64" cy="64" r="16" fill="url(#glow)" opacity="0.5">
        <animate attributeName="r" values="12;12;26;12" keyTimes="0;0.58;0.7;1" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0.35;1;0.35" keyTimes="0;0.58;0.7;1" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="64" cy="64" r="3" fill="#f26a2e">
        <animate attributeName="r" values="3;3;4.6;3" keyTimes="0;0.58;0.66;1" dur="3.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- text -->
    <g transform="translate(70 0)">
      <text x="0" y="170" font-size="84" font-weight="700" letter-spacing="-2" fill="url(#title)">Triangulator</text>
      <text x="4" y="222" font-size="27" fill="#9db0d6">See what every thread of a Linux process is doing.</text>
      <text x="4" y="258" font-size="27" fill="#9db0d6">Live, and as it was.</text>
      <g font-size="16" font-weight="600" fill="#cfd9f7">
        <g transform="translate(4 296)"><rect width="104" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#8aa4ff" stroke-opacity="0.35"/><text x="52" y="22.5" text-anchor="middle">C++23</text></g>
        <g transform="translate(120 296)"><rect width="196" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#8aa4ff" stroke-opacity="0.35"/><text x="98" y="22.5" text-anchor="middle">static sampler</text></g>
        <g transform="translate(328 296)"><rect width="156" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#8aa4ff" stroke-opacity="0.35"/><text x="78" y="22.5" text-anchor="middle">no root</text></g>
        <g transform="translate(496 296)"><rect width="148" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#8aa4ff" stroke-opacity="0.35"/><text x="74" y="22.5" text-anchor="middle">MIT</text></g>
      </g>
    </g>
  </g>
</svg>
