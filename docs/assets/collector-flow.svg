<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" role="img" aria-labelledby="title description">
<title id="title">Collector data flow</title>
<desc id="description">The collector receives UDP samples, builds thread state and summaries, stores SQLite history, and serves the dashboard over HTTP.</desc>
<defs>
  <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0a0f1f"/><stop offset="1" stop-color="#121c3b"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#7f9bff" opacity="0.10"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#9db0d6" stroke-width="1.5"/></marker>
</defs>
<style>
  text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #dbe4ff; }
  .heading { font-size: 26px; font-weight: 700; }
  .title { font-size: 20px; font-weight: 700; }
  .small { font-size: 14px; fill: #9db0d6; }
  .mono { font-size: 13px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: #9db0d6; }
  .tag { font-size: 12px; letter-spacing: 1.4px; font-weight: 700; fill: #34d399; }
  @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
</style>
<rect width="1100" height="420" rx="20" fill="url(#background)"/>
<rect x="20" y="20" width="1060" height="380" rx="16" fill="url(#grid)"/>
<text x="36" y="54" class="heading" >Collector</text>
<text x="36" y="82" class="small" >From UDP samples to stored history and a live dashboard.</text>
<text x="1064" y="54" class="tag" text-anchor="end">C++</text>
<rect x="36" y="148" width="260" height="194" rx="16" fill="#101a38" stroke="#60a5fa" stroke-opacity="0.65"/>
<text x="58" y="181" class="title" >Sampler</text>
<text x="58" y="208" class="small" >Thread + resource samples</text>
<text x="58" y="239" class="mono" >UDP :9400</text>
<rect x="58" y="270" width="38" height="42" rx="6" fill="#60a5fa" opacity="0.18"/>
<rect class="motion" x="58" y="270" width="38" height="42" rx="6" fill="#60a5fa" opacity="0.2"><animate attributeName="opacity" values="0.15;0.65;0.15" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></rect>
<rect x="110" y="270" width="38" height="42" rx="6" fill="#60a5fa" opacity="0.18"/>
<rect class="motion" x="110" y="270" width="38" height="42" rx="6" fill="#60a5fa" opacity="0.2"><animate attributeName="opacity" values="0.15;0.65;0.15" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/></rect>
<rect x="162" y="270" width="38" height="42" rx="6" fill="#60a5fa" opacity="0.18"/>
<rect class="motion" x="162" y="270" width="38" height="42" rx="6" fill="#60a5fa" opacity="0.2"><animate attributeName="opacity" values="0.15;0.65;0.15" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/></rect>
<rect x="214" y="270" width="38" height="42" rx="6" fill="#60a5fa" opacity="0.18"/>
<rect class="motion" x="214" y="270" width="38" height="42" rx="6" fill="#60a5fa" opacity="0.2"><animate attributeName="opacity" values="0.15;0.65;0.15" dur="2.4s" begin="-1.7999999999999998s" repeatCount="indefinite"/></rect>
<rect x="420" y="148" width="260" height="194" rx="16" fill="#101a38" stroke="#34d399" stroke-opacity="0.65"/>
<text x="442" y="181" class="title" >Collector</text>
<text x="442" y="209" class="small" >Check + assemble samples</text>
<text x="442" y="233" class="small" >Build thread state</text>
<text x="442" y="257" class="small" >Calculate rates + summaries</text>
<rect x="442" y="304" width="14" height="12" rx="3" fill="#34d399" opacity="0.55"/>
<rect class="motion" x="442" y="304" width="14" height="12" rx="3" fill="#34d399"><animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="0.0s" repeatCount="indefinite"/></rect>
<rect x="467" y="292" width="14" height="24" rx="3" fill="#34d399" opacity="0.55"/>
<rect class="motion" x="467" y="292" width="14" height="24" rx="3" fill="#34d399"><animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="-0.25s" repeatCount="indefinite"/></rect>
<rect x="492" y="282" width="14" height="34" rx="3" fill="#34d399" opacity="0.55"/>
<rect class="motion" x="492" y="282" width="14" height="34" rx="3" fill="#34d399"><animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="-0.5s" repeatCount="indefinite"/></rect>
<rect x="517" y="296" width="14" height="20" rx="3" fill="#34d399" opacity="0.55"/>
<rect class="motion" x="517" y="296" width="14" height="20" rx="3" fill="#34d399"><animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="-0.75s" repeatCount="indefinite"/></rect>
<rect x="542" y="276" width="14" height="40" rx="3" fill="#34d399" opacity="0.55"/>
<rect class="motion" x="542" y="276" width="14" height="40" rx="3" fill="#34d399"><animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="-1.0s" repeatCount="indefinite"/></rect>
<rect x="567" y="288" width="14" height="28" rx="3" fill="#34d399" opacity="0.55"/>
<rect class="motion" x="567" y="288" width="14" height="28" rx="3" fill="#34d399"><animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="-1.25s" repeatCount="indefinite"/></rect>
<rect x="592" y="298" width="14" height="18" rx="3" fill="#34d399" opacity="0.55"/>
<rect class="motion" x="592" y="298" width="14" height="18" rx="3" fill="#34d399"><animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="-1.5s" repeatCount="indefinite"/></rect>
<rect x="617" y="284" width="14" height="32" rx="3" fill="#34d399" opacity="0.55"/>
<rect class="motion" x="617" y="284" width="14" height="32" rx="3" fill="#34d399"><animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="-1.75s" repeatCount="indefinite"/></rect>
<rect x="804" y="126" width="260" height="104" rx="16" fill="#101a38" stroke="#fbbf24" stroke-opacity="0.65"/>
<text x="826" y="158" class="title" >SQLite</text>
<text x="826" y="184" class="small" >Summaries + resource history</text>
<text x="826" y="207" class="mono" >One file per UTC day</text>
<rect x="804" y="258" width="260" height="104" rx="16" fill="#101a38" stroke="#a78bfa" stroke-opacity="0.65"/>
<text x="826" y="290" class="title" >Dashboard + API</text>
<text x="826" y="316" class="small" >Live state + stored history</text>
<text x="826" y="339" class="mono" >HTTP :9401</text>
<path id="incoming" d="M296 245H416" fill="none" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="2" marker-end="url(#arrow)"/>
<text x="358" y="226" class="mono" text-anchor="middle">receive</text>
<path id="store" d="M680 204C738 204 738 178 800 178" fill="none" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="2" marker-end="url(#arrow)"/>
<text x="742" y="154" class="mono" text-anchor="middle">store</text>
<path id="serve" d="M680 288C738 288 738 310 800 310" fill="none" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="2" marker-end="url(#arrow)"/>
<text x="742" y="344" class="mono" text-anchor="middle">serve</text>
<circle class="motion" r="5" fill="#60a5fa" opacity="0">
  <animateMotion dur="2.4s" begin="0s" repeatCount="indefinite"><mpath href="#incoming"/></animateMotion>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
</circle>
<circle class="motion" r="5" fill="#60a5fa" opacity="0">
  <animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite"><mpath href="#incoming"/></animateMotion>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
</circle>
<circle class="motion" r="5" fill="#fbbf24" opacity="0">
  <animateMotion dur="2.4s" begin="0s" repeatCount="indefinite"><mpath href="#store"/></animateMotion>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
</circle>
<circle class="motion" r="5" fill="#fbbf24" opacity="0">
  <animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite"><mpath href="#store"/></animateMotion>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
</circle>
<circle class="motion" r="5" fill="#a78bfa" opacity="0">
  <animateMotion dur="2.4s" begin="0s" repeatCount="indefinite"><mpath href="#serve"/></animateMotion>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
</circle>
<circle class="motion" r="5" fill="#a78bfa" opacity="0">
  <animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite"><mpath href="#serve"/></animateMotion>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
</circle>
<text x="36" y="391" class="small" >Packet loss + session changes tracked</text>
<text x="1064" y="391" class="small" text-anchor="end">Ports shown are defaults.</text>
</svg>
