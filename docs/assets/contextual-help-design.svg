<path d="M1000 232H1436" stroke="#e4e6ea" fill="none" />
<text x="1000" y="270" font-size="28" fill="#0b0b0b" font-weight="600" >Run delay</text>
<text x="1000" y="297" font-size="14" fill="#4a4f58" font-weight="400" >Understand time spent waiting for a CPU.</text>
<rect x="1000" y="315" width="97" height="26" rx="13" fill="#eef4fc" stroke="#eef4fc" />
<text x="1012" y="333" font-size="12" fill="#1c5cab" font-weight="600" >One thread</text>
<rect x="1106" y="315" width="163" height="26" rx="13" fill="#eef4fc" stroke="#eef4fc" />
<text x="1118" y="333" font-size="12" fill="#1c5cab" font-weight="600" >% of elapsed time</text>
<text x="1000" y="371" font-size="15" fill="#4a4f58" font-weight="400" >A thread is ready to run, but it must wait</text>
<text x="1000" y="393" font-size="15" fill="#4a4f58" font-weight="400" >for a CPU to become available.</text>
<rect x="1000" y="417" width="436" height="97" rx="10" fill="#f3f7fd" stroke="#dce8f7" />
<text x="1018" y="442" font-size="11" fill="#1c5cab" font-weight="650" letter-spacing="1">EXAMPLE</text>
<text x="1018" y="473" font-size="22" fill="#0b0b0b" font-weight="600" >12% = 120 ms waiting</text>
<text x="1018" y="498" font-size="13" fill="#4a4f58" font-weight="400" >per elapsed second</text>
<text x="1000" y="548" font-size="15" fill="#0b0b0b" font-weight="600" >How to read it</text>
<text x="1000" y="574" font-size="14" fill="#4a4f58" font-weight="400" >Compare run delay with CPU use. Persistent delay</text>
<text x="1000" y="596" font-size="14" fill="#4a4f58" font-weight="400" >can indicate competition for CPU time. Check</text>
<text x="1000" y="618" font-size="14" fill="#4a4f58" font-weight="400" >cgroup CPU pressure and quota throttling.</text>
<text x="1000" y="659" font-size="15" fill="#0b0b0b" font-weight="600" >Measurement limits</text>
<text x="1000" y="684" font-size="13" fill="#4a4f58" font-weight="400" >Sleep and futex waits have separate state categories.</text>
<text x="1000" y="706" font-size="13" fill="#4a4f58" font-weight="400" >Run delay alone does not identify a cause.</text>
<path d="M1000 721H1436" stroke="#e4e6ea" fill="none" />
<text x="1000" y="742" font-size="13" fill="#1c5cab" font-weight="400" >Related: CPU  ·  Pressure stalls  ·  CPU throttled</text>
