<text x="1044" y="895" font-size="14" fill="#0b0b0b" font-weight="600" >Know the scope</text>
<text x="1044" y="917" font-size="12" fill="#4a4f58" font-weight="400" >Thread, process, cgroup, host, or namespace.</text>
<rect x="1002" y="943" width="29" height="26" rx="13" fill="#eef4fc" stroke="#eef4fc" />
<text x="1014" y="961" font-size="12" fill="#1c5cab" font-weight="600" >2</text>
<text x="1044" y="961" font-size="14" fill="#0b0b0b" font-weight="600" >Understand the number</text>
<text x="1044" y="983" font-size="12" fill="#4a4f58" font-weight="400" >Show units, the time interval, and an example.</text>
<rect x="1002" y="1009" width="29" height="26" rx="13" fill="#eef4fc" stroke="#eef4fc" />
<text x="1014" y="1027" font-size="12" fill="#1c5cab" font-weight="600" >3</text>
<text x="1044" y="1027" font-size="14" fill="#0b0b0b" font-weight="600" >Know the limits</text>
<text x="1044" y="1049" font-size="12" fill="#4a4f58" font-weight="400" >Explain missing data and what cannot be inferred.</text>
<text x="1002" y="1103" font-size="13" fill="#1c5cab" font-weight="400" >Same topics in cards, guides, and the page guide.</text>
<text x="40" y="1160" font-size="12" fill="#4a4f58" font-weight="400" >Separate interface states · Illustrative data · Proposed hover delay: 1,200 ms</text>
<text x="1140" y="1160" font-size="12" fill="#4a4f58" font-weight="400" >Triangulator / Contextual help</text>
