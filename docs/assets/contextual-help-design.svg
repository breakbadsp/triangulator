<title id="title">Triangulator contextual help design</title><desc id="desc">Separate proposed interface states. A dashboard cell shows a help card after a 1.2-second hover. Selecting its information button opens a detailed guide. Dark theme and touch examples appear below. All values are illustrative. This is a static design, not a working dashboard.</desc>
