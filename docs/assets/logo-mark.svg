<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t d">
  <title id="t">Triangulator logo</title>
  <desc id="d">An equilateral triangle with its circumscribed circle, inscribed circle and three medians. The medians meet at an orange dot, the target.</desc>
  <defs>
    <linearGradient id="edge" x1="14" y1="93" x2="64" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f6fe0"/>
      <stop offset="1" stop-color="#8b6cf0"/>
    </linearGradient>
  </defs>
  <!-- circumscribed circle: the three vertices sit on it -->
  <circle cx="64" cy="64" r="57.7" fill="none" stroke="#6f86c9" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="2 4"/>
  <!-- medians: each vertex looks at the target -->
  <path d="M64 6.3V64M14 92.9 64 64M114 92.9 64 64" stroke="#6f86c9" stroke-opacity="0.6" stroke-width="1.4"/>
  <!-- inscribed circle -->
  <circle cx="64" cy="64" r="28.9" fill="none" stroke="#6f86c9" stroke-opacity="0.65" stroke-width="1.6"/>
  <!-- the triangle -->
  <path d="M64 6.3 114 92.9H14Z" fill="none" stroke="url(#edge)" stroke-width="5" stroke-linejoin="round"/>
  <!-- three observation points -->
  <g fill="#0b1220" stroke="url(#edge)" stroke-width="3">
    <circle cx="64" cy="6.3" r="5.5"/>
    <circle cx="114" cy="92.9" r="5.5"/>
    <circle cx="14" cy="92.9" r="5.5"/>
  </g>
  <!-- the target -->
  <circle cx="64" cy="64" r="9" fill="#f26a2e" fill-opacity="0.22"/>
  <circle cx="64" cy="64" r="5.2" fill="#f26a2e"/>
</svg>
