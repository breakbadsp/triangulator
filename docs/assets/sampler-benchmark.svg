<svg xmlns="http://www.w3.org/2000/svg" width="960" height="344" viewBox="0 0 960 344" role="img" aria-labelledby="title desc">
<title id="title">Triangulator sampler: measured at 10 Hz</title>
<desc id="desc">100, 300, and 500 native threads. Median latency and delivered thread records per second. CPU is a percentage of one core. One busy target thread; all others sleep.</desc>
<rect width="960" height="344" rx="20" fill="#0c121b"/>
<g font-family="system-ui,sans-serif">
<text x="40" y="42" font-size="12" letter-spacing="2" fill="#d0fc92">TRIANGULATOR / SAMPLER BENCHMARK</text>
<text x="40" y="78" font-size="25" font-weight="650" fill="#f7fafc">Every thread. A few milliseconds.</text>
<g transform="translate(40,104)">
<rect width="280" height="180" rx="16" fill="#151d28" stroke="#303b49"/>
<text x="22" y="36" font-size="15" fill="#bec8d6">100 native threads</text>
<text x="22" y="92" font-size="44" font-weight="700" fill="#d0fc92">0.86<tspan font-size="19" fill="#bec8d6"> ms</tspan></text>
<text x="22" y="119" font-size="13" fill="#bec8d6">Median complete-sample latency</text>
<text x="22" y="154" font-size="15" fill="#f7fafc">1,000 records/s · 0.89% CPU</text>
</g><g transform="translate(336,104)">
<rect width="280" height="180" rx="16" fill="#151d28" stroke="#303b49"/>
<text x="22" y="36" font-size="15" fill="#bec8d6">300 native threads</text>
<text x="22" y="92" font-size="44" font-weight="700" fill="#d0fc92">2.48<tspan font-size="19" fill="#bec8d6"> ms</tspan></text>
<text x="22" y="119" font-size="13" fill="#bec8d6">Median complete-sample latency</text>
<text x="22" y="154" font-size="15" fill="#f7fafc">3,000 records/s · 2.51% CPU</text>
</g><g transform="translate(632,104)">
<rect width="280" height="180" rx="16" fill="#151d28" stroke="#303b49"/>
<text x="22" y="36" font-size="15" fill="#bec8d6">500 native threads</text>
<text x="22" y="92" font-size="44" font-weight="700" fill="#d0fc92">4.08<tspan font-size="19" fill="#bec8d6"> ms</tspan></text>
<text x="22" y="119" font-size="13" fill="#bec8d6">Median complete-sample latency</text>
<text x="22" y="154" font-size="15" fill="#f7fafc">5,000 records/s · 4.11% CPU</text>
</g>
<text x="40" y="316" font-size="13" fill="#bec8d6">10 Hz · Linux · 3 × 30 s per case · Loopback UDP · Host-specific results</text>
</g></svg>