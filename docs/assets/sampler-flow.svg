<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" role="img" aria-labelledby="title description">
<title id="title">Sampler data flow</title>
<desc id="description">The sampler reads thread data from /proc and resource data from Linux, then sends UDP samples to the collector. Thread frequency is 0.2 to 10 Hz.</desc>
<defs>
  <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0a0f1f"/><stop offset="1" stop-color="#121c3b"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#7f9bff" opacity="0.10"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#9db0d6" stroke-width="1.5"/></marker>
</defs>
<style>
  text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #dbe4ff; }
  .heading { font-size: 26px; font-weight: 700; }
  .title { font-size: 20px; font-weight: 700; }
  .small { font-size: 14px; fill: #9db0d6; }
  .mono { font-size: 13px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: #9db0d6; }
  .tag { font-size: 12px; letter-spacing: 1.4px; font-weight: 700; fill: #34d399; }
  @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
</style>
<rect width="1100" height="420" rx="20" fill="url(#background)"/>
<rect x="20" y="20" width="1060" height="380" rx="16" fill="url(#grid)"/>
<text x="36" y="54" class="heading" >Sampler</text>
<text x="36" y="82" class="small" >Read Linux process data. Send samples to the collector.</text>
<text x="1064" y="54" class="tag" text-anchor="end">C++ · STATIC BINARY</text>
<rect x="36" y="148" width="260" height="194" rx="16" fill="#101a38" stroke="#60a5fa" stroke-opacity="0.65"/>
<text x="58" y="181" class="title" >Target process</text>
<text x="58" y="209" class="mono" >/proc/&lt;pid&gt;/task/&lt;tid&gt;</text>
<text x="58" y="237" class="mono" >stat · schedstat · io · wchan</text>
<circle cx="65" cy="266" r="4" fill="#60a5fa"/>
<circle class="motion" cx="65" cy="266" r="4" fill="#34d399"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
<text x="78" y="270" class="mono" >worker</text>
<rect x="172" y="261" width="88" height="8" rx="4" fill="#60a5fa" opacity="0.35"/>
<circle cx="65" cy="291" r="4" fill="#60a5fa"/>
<circle class="motion" cx="65" cy="291" r="4" fill="#34d399"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="-1s" repeatCount="indefinite"/></circle>
<text x="78" y="295" class="mono" >io</text>
<rect x="172" y="286" width="70" height="8" rx="4" fill="#60a5fa" opacity="0.35"/>
<circle cx="65" cy="316" r="4" fill="#60a5fa"/>
<circle class="motion" cx="65" cy="316" r="4" fill="#34d399"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="-2s" repeatCount="indefinite"/></circle>
<text x="78" y="320" class="mono" >sender</text>
<rect x="172" y="311" width="52" height="8" rx="4" fill="#60a5fa" opacity="0.35"/>
<rect x="420" y="148" width="260" height="194" rx="16" fill="#101a38" stroke="#34d399" stroke-opacity="0.65"/>
<text x="442" y="181" class="title" >Sampler</text>
<text x="442" y="209" class="small" >Select by process name or PID</text>
<text x="442" y="241" class="mono" >Threads: 1 Hz default</text>
<text x="442" y="265" class="mono" >Range: 0.2–10 Hz</text>
<text x="442" y="297" class="small" >Resources: every 5 s by default</text>
<text x="442" y="319" class="small" >Pressure · I/O · socket queues</text>
<rect x="804" y="148" width="260" height="194" rx="16" fill="#101a38" stroke="#a78bfa" stroke-opacity="0.65"/>
<text x="826" y="181" class="title" >Collector</text>
<text x="826" y="209" class="mono" >UDP :9400</text>
<text x="826" y="241" class="small" >Thread state + summaries</text>
<text x="826" y="267" class="small" >SQLite history</text>
<text x="826" y="293" class="small" >Dashboard + API</text>
<path id="read" d="M296 245H416" fill="none" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="2" marker-end="url(#arrow)"/>
<text x="358" y="221" class="mono" text-anchor="middle">read</text>
<path id="send" d="M680 245H800" fill="none" stroke="#34d399" stroke-opacity="0.55" stroke-width="2" marker-end="url(#arrow)"/>
<text x="742" y="221" class="mono" text-anchor="middle">send UDP</text>
<circle class="motion" r="5" fill="#60a5fa" opacity="0">
  <animateMotion dur="2.4s" begin="0s" repeatCount="indefinite"><mpath href="#read"/></animateMotion>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
</circle>
<circle class="motion" r="5" fill="#60a5fa" opacity="0">
  <animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite"><mpath href="#read"/></animateMotion>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
</circle>
<circle class="motion" r="5" fill="#34d399" opacity="0">
  <animateMotion dur="2.4s" begin="0s" repeatCount="indefinite"><mpath href="#send"/></animateMotion>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
</circle>
<circle class="motion" r="5" fill="#34d399" opacity="0">
  <animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite"><mpath href="#send"/></animateMotion>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
</circle>
<text x="36" y="391" class="small" >Run as the target process user.</text>
<text x="1064" y="391" class="small" text-anchor="end">SIGHUP reloads the configuration.</text>
</svg>
