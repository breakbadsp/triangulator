<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-labelledby="t d">
<title id="t">Current constraints</title>
<desc id="d">Eight sampler rules: one sampler per host, single thread, lean tick path, no privileges, raw counters only, bounded tick cost, a one percent CPU budget, and measured overhead. Two known exceptions and the split between performance-critical code and separate programs are also shown.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#121c3b"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#7f9bff" fill-opacity="0.12"/></pattern>
<clipPath id="round"><rect width="1200" height="690" rx="20"/></clipPath>
</defs>
<style>
text { font-family: Inter, "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; fill: #dbe4ff; }
.h { font-size: 18px; font-weight: 700; }
.s { font-size: 13px; fill: #9db0d6; }
.m { font-size: 12px; fill: #9db0d6; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.zone { font-size: 12px; font-weight: 700; letter-spacing: 2.4px; fill: #7f93c4; }
.box { fill: #101a38; stroke-width: 1.6; }
</style>
<g clip-path="url(#round)"><rect width="1200" height="690" fill="url(#bg)"/><rect width="1200" height="690" fill="url(#dots)"/>
<text class="h" x="30" y="40" style="font-size:22px">Current constraints</text>
<text class="s" x="30" y="58">The sampler runs on the target host, so its overhead stays negligible. Every sampler change keeps these rules.</text>
<rect class="box" x="30" y="82" width="270" height="150" rx="12" stroke="#34d399" stroke-opacity="0.7"/>
<text class="h" x="46" y="110" style="font-size:15px">1 · One sampler per host</text>
<text class="s" x="46" y="132">One process monitors every target on</text>
<text class="s" x="46" y="149">the host. Never one sampler per</text>
<text class="s" x="46" y="166">target.</text>
<rect x="160" y="188" width="26" height="22" rx="4" fill="none" stroke="#34d399"/><circle cx="173" cy="199" r="5" fill="#34d399"><animate attributeName="r" values="4;6;4" dur="1.4s" repeatCount="indefinite"/></circle><rect x="220" y="186" width="30" height="7" rx="3" fill="#60a5fa" fill-opacity="0.5"/><path d="M188 199L218 190" stroke="#34d399" stroke-opacity="0.5"/><rect x="220" y="196" width="30" height="7" rx="3" fill="#60a5fa" fill-opacity="0.5"/><path d="M188 199L218 200" stroke="#34d399" stroke-opacity="0.5"/><rect x="220" y="206" width="30" height="7" rx="3" fill="#60a5fa" fill-opacity="0.5"/><path d="M188 199L218 210" stroke="#34d399" stroke-opacity="0.5"/><rect class="box" x="320" y="82" width="270" height="150" rx="12" stroke="#34d399" stroke-opacity="0.7"/>
<text class="h" x="336" y="110" style="font-size:15px">2 · Single thread</text>
<text class="s" x="336" y="132">One loop on a monotonic deadline. No</text>
<text class="s" x="336" y="149">threads, pools or async runtimes.</text>
<circle cx="520" cy="200" r="22" fill="none" stroke="#34d399" stroke-opacity="0.4" stroke-dasharray="3 5"/><circle r="4.5" fill="#34d399"><animateMotion dur="1.6s" repeatCount="indefinite" path="M520 178a22 22 0 1 1 -0.01 0"/></circle><rect class="box" x="610" y="82" width="270" height="150" rx="12" stroke="#34d399" stroke-opacity="0.7"/>
<text class="h" x="626" y="110" style="font-size:15px">3 · Lean tick path</text>
<text class="s" x="626" y="132">No allocation and no blocking disk</text>
<text class="s" x="626" y="149">or network I/O. Static binary, no</text>
<text class="s" x="626" y="166">runtime dependencies.</text>
<rect x="626" y="206" width="8" height="8" rx="2" fill="#34d399" fill-opacity="0.3"><animate attributeName="fill-opacity" values="0.25;0.9;0.25" dur="1.6s" begin="0.0s" repeatCount="indefinite"/></rect><rect x="638" y="206" width="8" height="8" rx="2" fill="#34d399" fill-opacity="0.3"><animate attributeName="fill-opacity" values="0.25;0.9;0.25" dur="1.6s" begin="0.2s" repeatCount="indefinite"/></rect><rect x="650" y="206" width="8" height="8" rx="2" fill="#34d399" fill-opacity="0.3"><animate attributeName="fill-opacity" values="0.25;0.9;0.25" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></rect><rect x="662" y="206" width="8" height="8" rx="2" fill="#34d399" fill-opacity="0.3"><animate attributeName="fill-opacity" values="0.25;0.9;0.25" dur="1.6s" begin="0.6s" repeatCount="indefinite"/></rect><rect x="674" y="206" width="8" height="8" rx="2" fill="#34d399" fill-opacity="0.3"><animate attributeName="fill-opacity" values="0.25;0.9;0.25" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></rect><rect x="686" y="206" width="8" height="8" rx="2" fill="#34d399" fill-opacity="0.3"><animate attributeName="fill-opacity" values="0.25;0.9;0.25" dur="1.6s" begin="1.0s" repeatCount="indefinite"/></rect><rect x="698" y="206" width="8" height="8" rx="2" fill="#34d399" fill-opacity="0.3"><animate attributeName="fill-opacity" values="0.25;0.9;0.25" dur="1.6s" begin="1.2s" repeatCount="indefinite"/></rect><rect x="710" y="206" width="8" height="8" rx="2" fill="#34d399" fill-opacity="0.3"><animate attributeName="fill-opacity" values="0.25;0.9;0.25" dur="1.6s" begin="1.4s" repeatCount="indefinite"/></rect><text class="m" x="626" y="196" style="font-size:11px">0 allocs · 0 blocking I/O</text><rect class="box" x="900" y="82" width="270" height="150" rx="12" stroke="#34d399" stroke-opacity="0.7"/>
<text class="h" x="916" y="110" style="font-size:15px">4 · No privileges</text>
<text class="s" x="916" y="132">Reads only /proc files its user can</text>
<text class="s" x="916" y="149">read. No sudo, capabilities or</text>
<text class="s" x="916" y="166">ptrace.</text>
<rect x="1086" y="196" width="28" height="22" rx="4" fill="none" stroke="#34d399" stroke-width="1.6"/><path d="M1092 196v-8a8 8 0 0 1 16 0v8" fill="none" stroke="#34d399" stroke-width="1.6"><animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></path><circle cx="1100" cy="207" r="3" fill="#34d399"/><rect class="box" x="30" y="252" width="270" height="150" rx="12" stroke="#60a5fa" stroke-opacity="0.7"/>
<text class="h" x="46" y="280" style="font-size:15px">5 · Raw counters only</text>
<text class="s" x="46" y="302">No rates, rules or alerts. The</text>
<text class="s" x="46" y="319">collector does the interpretation.</text>
<text class="m" x="46" y="366" style="font-size:11px">counter → collector</text><path d="M46 380H284" stroke="#60a5fa" stroke-opacity="0.4"/><circle r="3.5" fill="#60a5fa"><animateMotion dur="1.8s" begin="0.0s" repeatCount="indefinite" path="M46 380H284"/></circle><circle r="3.5" fill="#60a5fa"><animateMotion dur="1.8s" begin="-0.6s" repeatCount="indefinite" path="M46 380H284"/></circle><circle r="3.5" fill="#60a5fa"><animateMotion dur="1.8s" begin="-1.2s" repeatCount="indefinite" path="M46 380H284"/></circle><rect class="box" x="320" y="252" width="270" height="150" rx="12" stroke="#60a5fa" stroke-opacity="0.7"/>
<text class="h" x="336" y="280" style="font-size:15px">6 · Bounded tick cost</text>
<text class="s" x="336" y="302">One /proc scan per tick, shared by</text>
<text class="s" x="336" y="319">targets. At most one heavy scan per</text>
<text class="s" x="336" y="336">tick.</text>
<rect x="336" y="362" width="50" height="24" rx="5" fill="#60a5fa" fill-opacity="0.15" stroke="#60a5fa" stroke-opacity="0.6"><animate attributeName="fill-opacity" values="0.15;0.15;0.8;0.15;0.15" keyTimes="0;0.000;0.040;0.313;1" dur="4.5s" repeatCount="indefinite"/></rect><text class="m" x="361" y="378" text-anchor="middle" style="font-size:10px">thread</text><rect x="392" y="362" width="50" height="24" rx="5" fill="#60a5fa" fill-opacity="0.15" stroke="#60a5fa" stroke-opacity="0.6"><animate attributeName="fill-opacity" values="0.15;0.15;0.8;0.15;0.15" keyTimes="0;0.333;0.373;0.647;1" dur="4.5s" repeatCount="indefinite"/></rect><text class="m" x="417" y="378" text-anchor="middle" style="font-size:10px">resource</text><rect x="448" y="362" width="50" height="24" rx="5" fill="#60a5fa" fill-opacity="0.15" stroke="#60a5fa" stroke-opacity="0.6"><animate attributeName="fill-opacity" values="0.15;0.15;0.8;0.15;0.15" keyTimes="0;0.667;0.707;0.980;1" dur="4.5s" repeatCount="indefinite"/></rect><text class="m" x="473" y="378" text-anchor="middle" style="font-size:10px">memory</text><text class="m" x="510" y="378" style="font-size:11px">1 at a time</text><rect class="box" x="610" y="252" width="270" height="150" rx="12" stroke="#60a5fa" stroke-opacity="0.7"/>
<text class="h" x="626" y="280" style="font-size:15px">7 · CPU budget</text>
<text class="s" x="626" y="302">Default 1% of one core. The sampler</text>
<text class="s" x="626" y="319">lowers its rate to stay inside.</text>
<rect x="626" y="358" width="238" height="12" rx="6" fill="#0a0f1f" stroke="#60a5fa" stroke-opacity="0.6"/><rect x="626" y="358" width="40" height="12" rx="6" fill="#60a5fa"><animate attributeName="width" values="40;190;190;70;40" keyTimes="0;0.45;0.55;0.8;1" dur="5s" repeatCount="indefinite"/></rect><path d="M816 354v20" stroke="#fbbf24" stroke-width="2"/><text class="m" x="816" y="388" text-anchor="middle" style="font-size:10px;fill:#fbbf24">1% of one core</text><text class="m" x="626" y="388" style="font-size:10px">throttle lowers rate</text><rect class="box" x="900" y="252" width="270" height="150" rx="12" stroke="#60a5fa" stroke-opacity="0.7"/>
<text class="h" x="916" y="280" style="font-size:15px">8 · Measure overhead</text>
<text class="s" x="916" y="302">Each change that can affect overhead</text>
<text class="s" x="916" y="319">reports a measurement in the pull</text>
<text class="s" x="916" y="336">request.</text>
<rect x="916" y="382" width="9" height="4" rx="2" fill="#60a5fa"><animate attributeName="y" values="382;374;382" dur="1.6s" repeatCount="indefinite"/><animate attributeName="height" values="4;12;4" dur="1.6s" repeatCount="indefinite"/></rect><rect x="930" y="382" width="9" height="4" rx="2" fill="#60a5fa"><animate attributeName="y" values="382;367;382" dur="1.8s" repeatCount="indefinite"/><animate attributeName="height" values="4;19;4" dur="1.8s" repeatCount="indefinite"/></rect><rect x="944" y="382" width="9" height="4" rx="2" fill="#60a5fa"><animate attributeName="y" values="382;374;382" dur="2.0s" repeatCount="indefinite"/><animate attributeName="height" values="4;12;4" dur="2.0s" repeatCount="indefinite"/></rect><rect x="958" y="382" width="9" height="4" rx="2" fill="#60a5fa"><animate attributeName="y" values="382;367;382" dur="2.2s" repeatCount="indefinite"/><animate attributeName="height" values="4;19;4" dur="2.2s" repeatCount="indefinite"/></rect><rect x="972" y="382" width="9" height="4" rx="2" fill="#60a5fa"><animate attributeName="y" values="382;374;382" dur="2.4s" repeatCount="indefinite"/><animate attributeName="height" values="4;12;4" dur="2.4s" repeatCount="indefinite"/></rect><rect x="986" y="382" width="9" height="4" rx="2" fill="#60a5fa"><animate attributeName="y" values="382;367;382" dur="2.6s" repeatCount="indefinite"/><animate attributeName="height" values="4;19;4" dur="2.6s" repeatCount="indefinite"/></rect><text class="m" x="1016" y="384" style="font-size:11px">CPU · RSS</text><rect class="box" x="30" y="426" width="1140" height="104" rx="12" stroke="#fbbf24" stroke-opacity="0.7" stroke-dasharray="6 5"/>
<text class="zone" x="50" y="452" style="fill:#fbbf24">KNOWN EXCEPTIONS · OWNER REVIEW PENDING</text>
<text class="h" x="50" y="478" style="font-size:14px">/dev/kmsg read for exit reports</text>
<text class="s" x="50" y="498">At most 50 ms. Best effort. Needs CAP_SYSLOG when dmesg_restrict=1.</text>
<text class="h" x="620" y="478" style="font-size:14px">sock_diag socket dump</text>
<text class="s" x="620" y="498">Waits up to 1 s per recv. No total time budget. Capped at 1,000,000 sockets.</text>
<rect x="50" y="510" width="1100" height="3" rx="1.5" fill="#fbbf24" fill-opacity="0.15"/><rect x="50" y="510" width="60" height="3" rx="1.5" fill="#fbbf24"><animate attributeName="x" values="50;1090;50" dur="6s" repeatCount="indefinite"/></rect>
<rect class="box" x="30" y="550" width="560" height="100" rx="12" stroke="#34d399" stroke-opacity="0.8"/>
<text class="h" x="48" y="578" style="font-size:15px">C++ or Rust · performance-critical</text>
<text class="s" x="48" y="600">Sampler · core collector · storage · dashboard API</text>
<text class="s" x="48" y="620">Helpers that process samples at high rates.</text>
<text class="s" x="48" y="638">Core features are added only when requested.</text>
<rect class="box" x="610" y="550" width="560" height="100" rx="12" stroke="#a78bfa" stroke-opacity="0.8"/>
<text class="h" x="628" y="578" style="font-size:15px">Separate programs · any language</text>
<text class="s" x="628" y="600">Alerts · alert settings and delivery · reports · extended dashboard data</text>
<text class="s" x="628" y="620">Read read-only SQLite day files or the HTTP API.</text>
<text class="s" x="628" y="638">Never read the UDP stream. Never run in the collector main loop.</text>
<path d="M590 600H610" stroke="#8aa4ff" stroke-opacity="0.6" stroke-dasharray="4 4"/><circle r="3.5" fill="#a78bfa"><animateMotion dur="1.4s" repeatCount="indefinite" path="M590 600H610"/></circle>
</g></svg>
