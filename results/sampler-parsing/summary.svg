<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">Sampler parsing benchmarks</title>
<desc id="desc">Isolated parser time reductions and whole-sampler CPU before and after.</desc>
<rect width="1200" height="710" rx="18" fill="#101922"/>
<g font-family="system-ui, sans-serif" fill="#eaf1ef">
<text x="48" y="57" fill="#9ce5b9" font-size="14" font-weight="700" letter-spacing="2">TRIANGULATOR / PERFORMANCE</text>
<text x="48" y="104" font-size="31" font-weight="700">Parser microbenchmarks</text>
<text x="48" y="135" fill="#a9b9c2" font-size="17">Reduction in mean wall time per call · Hyperfine · 15 runs</text>
<text x="48" y="176" fill="#a9b9c2" font-size="14">FUNCTION</text>
<text x="340" y="176" fill="#a9b9c2" font-size="14">FASTER · 0–40%</text>
<text x="805" y="176" fill="#a9b9c2" font-size="14">BEFORE → AFTER (ns / call)</text>
<text x="48" y="221" font-size="18">Thread stat</text>
<rect x="340" y="204" width="380" height="22" rx="5" fill="#263743"/>
<rect x="340" y="204" width="137.9" height="22" rx="5" fill="#76dca8"/>
<text x="735" y="221" font-size="17" font-weight="700" fill="#9ce5b9">14.5%</text>
<text x="805" y="221" font-size="17">358.9 → 306.8</text>
<text x="48" y="276" font-size="18">Number · short</text>
<rect x="340" y="259" width="380" height="22" rx="5" fill="#263743"/>
<rect x="340" y="259" width="187.9" height="22" rx="5" fill="#76dca8"/>
<text x="735" y="276" font-size="17" font-weight="700" fill="#9ce5b9">19.8%</text>
<text x="805" y="276" font-size="17">10.2 → 8.2</text>
<text x="48" y="331" font-size="18">Number · mixed</text>
<rect x="340" y="314" width="380" height="22" rx="5" fill="#263743"/>
<rect x="340" y="314" width="225.9" height="22" rx="5" fill="#76dca8"/>
<text x="735" y="331" font-size="17" font-weight="700" fill="#9ce5b9">23.8%</text>
<text x="805" y="331" font-size="17">14.2 → 10.8</text>
<text x="48" y="386" font-size="18">Scheduler counters</text>
<rect x="340" y="369" width="380" height="22" rx="5" fill="#263743"/>
<rect x="340" y="369" width="161.3" height="22" rx="5" fill="#76dca8"/>
<text x="735" y="386" font-size="17" font-weight="700" fill="#9ce5b9">17.0%</text>
<text x="805" y="386" font-size="17">40.2 → 33.4</text>
<text x="48" y="441" font-size="18">I/O counters</text>
<rect x="340" y="424" width="380" height="22" rx="5" fill="#263743"/>
<rect x="340" y="424" width="307.5" height="22" rx="5" fill="#76dca8"/>
<text x="735" y="441" font-size="17" font-weight="700" fill="#9ce5b9">32.4%</text>
<text x="805" y="441" font-size="17">72.9 → 49.3</text>
<line x1="48" y1="500" x2="1152" y2="500" stroke="#3b4d57"/>
<text x="48" y="542" font-size="24" font-weight="700">Whole sampler · 16 × 50 threads · 5 Hz</text>
<text x="48" y="579" font-size="21" fill="#9ce5b9">12 s trials: 3.751% → 3.853% of one core</text>
<text x="48" y="610" font-size="21" fill="#9ce5b9">30 s profiles: 3.770% → 3.771% of one core</text>
<text x="48" y="640" fill="#a9b9c2" font-size="16">Three 12 s trials and two 30 s profiles per build. Host was not isolated.</text>
<text x="48" y="682" fill="#a9b9c2" font-size="14">Buffer reuse was tested separately and rejected: it was slower in both comparisons.</text>
</g></svg>
